name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#1f2ea6&color_dots=#d4d6d1,#b4b9d6,#8088c4,#4f5ab3,#1f2ea6
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#e4e6e1&color_dots=#161b22,#1f2a5c,#2a3a8a,#3b4fc4,#7d8cff

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
